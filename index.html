<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./static/css/styles.css">

    <title>Hotel Reservation</title>
</head>

<body>
    <section id="welcome">
        <h1>&#9734; Welcome to our family hotel &#9734;</h1>

        <div class="home-container">
            <div class="info">
                <h1>Hotel Reservation</h1>
            </div>
        </div>
    </section>

    <div class="site-content">
        <!-- Search Form -->
        <div class="search-form-content custom-form">
            <div class="background">
                <div class="shape"></div>
                <div class="shape"></div>
            </div>

            <form>
                <h3>Search Here</h3>

                <label for="check-in">Check-in:</label>
                <input type="date" id="check-in" name="check-in">

                <label for="check-out">Check-out:</label>
                <input type="date" id="check-out" name="check-out">

                <label for="people">Number of people:</label>
                <input type="number" min="1" id="people" name="people">

                <button id="search-form-button">Next</button>
            </form>
        </div>

        <!-- Our Offers Form -->
        <div class="search-result-form-content custom-form hidden">
            <div class="background">
                <div class="shape"></div>
                <div class="shape"></div>
            </div>

            <form>
                <h3>Our Offers</h3>

                <section class="offers">
                    <article class="offer-card room-type selected-room">
                        <img src="./static/img/budgetRoom.jpg" alt="Budget room">
                        <h4>Budget Room - 120 USD</h4>
                    </article>

                    <article class="offer-card room-type">
                        <img src="./static/img/familyRoom.jpg" alt="Family room">
                        <h4>Family Room - 250 USD</h4>
                    </article>

                    <article class="offer-card room-type">
                        <img src="./static/img/kingRoom.jpg" alt="King room">
                        <h4>King Room - 500 USD</h4>
                    </article>
                </section>

                <div class="buttons">
                    <button id="search-back-btn">Back</button>
                    <button id="search-next-btn">Next</button>
                </div>
            </form>
        </div>

        <!-- Guest Details Form -->
        <div class="guest-details-form-content custom-form hidden">
            <div class="background">
                <div class="shape"></div>
                <div class="shape"></div>
            </div>

            <form>
                <h3>Personal Information</h3>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" autocomplete="name">

                <label for="phone-number">Phone Number:</label>
                <input type="tel" id="phone-number" name="phone-number" autocomplete="tel">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" autocomplete="email">

                <div class="buttons">
                    <button id="guest-details-back-btn">Back</button>
                    <button id="guest-details-next-btn">Next</button>
                </div>
            </form>
        </div>

        <!-- Thank You Page -->
        <div class="thank-you-content custom-form hidden">
            <div class="background">
                <div class="shape"></div>
                <div class="shape"></div>
            </div>

            <form class="thank-you">
                <h3>Thank you for your reservation!</h3>
                <button id="new-reservation">Make new reservation</button>
            </form>
        </div>
    </div>

    <script src="solution.js"></script>
</body>

</html>
